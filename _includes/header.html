<header class="header">
  <div class="header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Red Foundations home">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">{{ site.title }}</span>
    </a>

    <button class="nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="main-nav" aria-label="Site">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/book/' | relative_url }}">The Book</a>
      <a href="{{ '/characters/' | relative_url }}">Profiles</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/life-on-mars/' | relative_url }}">Life on Mars</a>
      <a href="{{ '/sentinel_landing.html' | relative_url }}">SENTINEL</a>
      <a class="nav__cta nav__cta--buy" href="https://a.co/d/0bINYe4x" target="_blank" rel="noopener">Buy Now</a>
      <a class="nav__cta" href="{{ site.newsletter_url }}" target="_blank" rel="noopener">Get the free handbook</a>
    </nav>
  </div>
</header>

<script>
  (function(){
    var btn = document.querySelector('.nav-toggle');
    var nav = document.getElementById('main-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function(){
      var open = nav.classList.toggle('nav--open');
      btn.setAttribute('aria-expanded', String(open));
      btn.classList.toggle('nav-toggle--open', open);
    });
  })();
</script>
